# question-ranking-mcp
#
# One bundle, three components:
#   1. resources/serving.yml  - a Model Serving endpoint splitting traffic 50/50
#                               across two open-source provisioned-throughput models
#   2. resources/app.yml      - the MCP server on Databricks Apps (streamable HTTP, /mcp)
#   3. resources/uc.yml       - the Unity Catalog schema + the (opt-in) MCP registration job
bundle:
  name: question-ranking-mcp
  databricks_cli_version: ">=1.23.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Existing Unity Catalog catalog that owns the MCP schema. The bundle does NOT create
      the catalog; the deploy identity needs USE CATALOG + CREATE SCHEMA on it.
    default: prod_ai

  schema:
    description: UC schema created by this bundle. Hyphens are legal in a UC schema name.
    default: question-ranking-mcp

  endpoint_name:
    description: Name of the 50/50 traffic-split Model Serving endpoint.
    default: question-ranking-router

  app_name:
    description: >-
      Databricks App name. Keep the `mcp-` prefix so the AI Playground recognises it as an
      MCP server.
    default: mcp-question-ranking

  # --- The 50/50 model pair -------------------------------------------------------------
  # Both are open-source, small, and provisioned-throughput optimizable with the SAME
  # throughput-band scaling family. Mixing scaling families in one endpoint is rejected,
  # and pay-per-token entities cannot be traffic-split at all - hence our own endpoint with
  # two provisioned-throughput `system.ai.*` entities.
  #
  # The model inventory was read from a fallback workspace, not the deploy target, so every
  # model field is a variable: override per workspace instead of editing YAML.
  model_a_name:
    description: UC path of the first served model.
    default: system.ai.llama_v3_2_3b_instruct
  model_a_version:
    description: Version of the first served model.
    default: "2"
  model_a_max_throughput:
    description: >-
      Max provisioned throughput for model A, in tokens/second. MUST be a multiple of the
      model's throughput_chunk_size (22000 for llama_v3_2_3b_instruct); this is exactly one
      chunk, the cheapest valid value.
    default: 22000

  model_b_name:
    description: UC path of the second served model.
    default: system.ai.mistral_7b_instruct_v0_2
  model_b_version:
    description: Version of the second served model.
    default: "2"
  model_b_max_throughput:
    description: >-
      Max provisioned throughput for model B, in tokens/second. One throughput_chunk_size
      for mistral_7b_instruct_v0_2 (2450).
    default: 2450

  # --- Unity Catalog MCP registration (opt-in) ------------------------------------------
  register_uc_mcp_service:
    description: >-
      When true, the `register_uc_mcp` job attempts to create a UC HTTP connection and MCP
      service for the app. Defaults to false because Databricks documents Databricks
      Apps-hosted MCP servers as an unsupported registration source - see the README. The
      core deploy always succeeds either way; this only changes what the job does when run.
    default: "false"

  mcp_service_id:
    description: Name of the UC MCP service, if registration is enabled.
    default: question_ranking

  uc_connection_name:
    description: Name of the schema-level UC HTTP connection, if registration is enabled.
    default: question_ranking_mcp_http

  mcp_bearer_token_secret:
    description: >-
      Optional "<scope>/<key>" pointing at a Databricks secret holding the bearer token for
      the UC HTTP connection. `bearer_token` is a required HTTP-connection option, but
      Databricks Apps MCP endpoints require OAuth and reject static bearer tokens - see the
      README's Unity Catalog registration section.
    default: ""

targets:
  # Validated against the authenticated `perdomo` workspace. Host is overridable so this
  # target works from any profile: `databricks bundle validate -t dev --profile <name>`.
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-perdomo-demos.cloud.databricks.com
    variables:
      # `mode: development` prefixes most resource names automatically but NOT app names,
      # because app names have a restricted charset. Suffix it manually so two developers
      # deploying `dev` to the same workspace do not fight over one app.
      app_name: mcp-question-ranking-${workspace.current_user.short_name}

  # The real deploy target. Nobody has a local profile for this host yet, so `prod` cannot
  # be validated or deployed until the `agents-deploy` service principal exists.
  prod:
    mode: production
    workspace:
      host: https://fe-sandbox-accelerate-ai-gateway.cloud.databricks.com
      # `mode: production` requires an explicit root_path so only one copy is deployed.
      # Scoping it to the deploying identity (the `agents-deploy` SP in a real deploy) keeps
      # it restricted; a /Workspace/Shared root would be writable by every workspace user.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: agents-deploy
